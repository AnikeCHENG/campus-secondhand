spring.application.name=campus-secondhand
# ?????
spring.datasource.url=jdbc:mysql://localhost:3306/campus_secondhand?useUnicode=true&characterEncoding=utf8&serverTimezone=GMT%2B8&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# MyBatis-Plus??
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.global-config.db-config.id-type=auto
mybatis-plus.global-config.db-config.logic-delete-field=deleted
mybatis-plus.global-config.db-config.logic-delete-value=1
mybatis-plus.global-config.db-config.logic-not-delete-value=0

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# Mail（敏感项走环境变量，缺失时启动即报错，避免误发）
spring.mail.host=${MAIL_HOST:smtp.qq.com}
spring.mail.port=${MAIL_PORT:465}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.starttls.enable=false

# JWT??
jwt.secret=${JWT_SECRET}
jwt.expiration=86400

# ????
server.port=8080
# 增加请求体大小限制，支持Base64图片上传（最大50MB）
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
# Tomcat配置，处理大请求体（防止上传大图片时请求过大）
server.tomcat.max-swallow-size=50MB
server.tomcat.max-http-post-size=50MB

# 日志配置
logging.level.com.example.wastereuseplatform=DEBUG

# 自动执行 SQL 脚本（已手动创建数据库，此处设为never跳过自动初始化）
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true
spring.sql.init.schema-locations=classpath:plaza-schema.sql


# ============================ 订单与支付 ============================
# 订单支付有效期（分钟）。下单时据此计算 orders.expire_time，
# 收银台倒计时、支付接口过期检查、定时任务扫描三处共用该口径。
# 注意：修改后仅影响新下单的订单，已有订单保留其原有 expire_time。
order.pay-timeout-minutes=30

# 超时订单定时扫描间隔（毫秒），默认 5 分钟
order.timeout-scan-interval-ms=300000

# 支付渠道。mock=本地模拟（永远成功）；接入真实渠道时新增实现类并改此值
payment.channel=mock
